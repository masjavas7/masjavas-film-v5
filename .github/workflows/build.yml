name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          GROKPI_API_KEY: test-key-for-ci
          VITEST: 'true'
          NODE_ENV: test

      - name: Build frontend
        run: npm run build