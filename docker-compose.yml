services:
  masjavas-api:
    build: .
    container_name: masjavas-film-v5
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SERVE_STATIC: "true"
      PORT: 3000
      LOG_ACCESS: "true"
      GROKPI_BASE_URL: ${GROKPI_BASE_URL:-https://www.grokpi.masjavas.my.id/v1}
      GROKPI_API_KEY: ${GROKPI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - masjavas-data:/app/server/data
      - masjavas-uploads:/app/server/uploads
      - masjavas-exports:/app/server/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  masjavas-data:
  masjavas-uploads:
  masjavas-exports: